<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS</title>

    <link rel="stylesheet" href="styles/10-rps.css">
  </head>

  <body>
    <p class="title">Rock Paper Scissors</p>
    <button onclick="
     getResult('Rock');
    " class= "move-button">
      <img src="Images/rps/rock-emoji.png" class ="move-icon">
    </button>

    <button onclick="
      getResult('Paper');
    " class= "move-button">
      <img src="Images/rps/paper-emoji.png" class ="move-icon">
    </button>

    <button onclick="
      getResult('Scissors');
    " class= "move-button">
      <img src="Images/rps/scissors-emoji.png" class ="move-icon">
    </button>

    <p class="js-result result" ></p>
    <p class="js-move move"></p>
    <p class="js-score score"></p>

    <button onclick="
      resetScore();
      localStorage.removeItem('score');
    " class="reset-score-button">Reset Score</button>

    <button class="reset-score-button js-auto-play-button"
    onclick="toggleAutoPlay();">
      Auto Play
    </button>

    <script src="scripts/12-rps.js"></script>
  </body>

</html>
