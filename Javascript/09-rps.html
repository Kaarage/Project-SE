<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS</title>
  </head>

  <body>
    <p>Rock Paper Scissors</p>
    <button onclick="
     getResult('Rock');
    ">Rock</button>

    <button onclick="
      getResult('Paper');
    ">Paper</button>

    <button onclick="
      getResult('Scissors');
    ">Scissors</button>

    <p class="js-result"></p>
    <p class="js-move"></p>
    <p class="js-score"></p>

    <button onclick="
      resetScore();
      localStorage.removeItem('score');
    ">Reset Score</button>

    <p>Click here to see the final version of the project</p>

    <script>

      let score = JSON.parse(localStorage.getItem
        ('score')) || {
        wins: 0,
        losses: 0,
        ties: 0
      };

      updateScoreElement();

      // if (!score) {
      //   score = {
      //     wins: 0,
      //     losses: 0,
      //     ties: 0
      //   };
      // }

      function pickComputerMove() {
        const randomNumber = Math.random();

        let computerMove = '';

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'Rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'Paper';
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = 'Scissors';
        }

        return computerMove;
      }


      function getResult(move) {

        const computerMove = pickComputerMove();
        let result = '';

        if (move === 'Rock') {

          if (computerMove === 'Rock') {
            result = 'Tie';
          } else if (computerMove === 'Paper') {
            result = 'You Lose.';
          } else if (computerMove === 'Scissors') {
            result = 'You Win.';
          }

        } else if (move === 'Paper') {

          if (computerMove === 'Rock') {
            result = 'You Win.';
          } else if (computerMove === 'Paper') {
            result = 'Tie';
          } else if (computerMove === 'Scissors') {
            result = 'You Lose.';
          }

        } else if (move === 'Scissors') {

          if (computerMove === 'Rock') {
            result = 'You Lose.';
          } else if (computerMove === 'Paper') {
            result = 'You Win.';
          } else if (computerMove === 'Scissors') {
            result = 'Tie';
          }

        }

        if (result === 'You Win.') {
          score.wins += 1;
        } else if (result === 'You Lose.') {
          score.losses += 1;
        } else if (result === 'Tie') {
          score.ties += 1;
        }

        localStorage.setItem('score', JSON.stringify(score));

        document.querySelector('.js-result').innerHTML = result;
        document.querySelector('.js-move').innerHTML = 
          `You ${move} - ${computerMove} Computer`;

        updateScoreElement();


        // alert(`You picked ${move}. Computer picked ${computerMove}. ${result} 
        // \n Wins: ${score.wins} | Losses: ${score.losses} | Ties: ${score.ties}`);
      }

      function updateScoreElement() {
        document.querySelector('.js-score')
          .innerHTML = `Wins: ${score.wins} | Losses: 
          ${score.losses} | Ties: ${score.ties}`;
      }

      function resetScore() {
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;

        updateScoreElement();
      }


    </script>
  </body>

</html>
