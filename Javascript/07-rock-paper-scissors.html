<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>RPS</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>
    <button onclick="
     getResult('Rock');
    ">Rock</button>
    
    <button onclick="
      getResult('Paper');
    ">Paper</button>

    <button onclick="
      getResult('Scissors');
    ">Scissors</button>

    <p>Click here to se the final version of the project</p>

    <script>

      function pickComputerMove() {
        const randomNumber = Math.random();

        let computerMove = '';

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'Rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'Paper';
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = 'Scissors';
        } 

        return computerMove;
      }


      function getResult(move) {

        const computerMove = pickComputerMove();
        let result = '';
        
        if(move === 'Rock') {

          if (computerMove === 'Rock') {
            result = 'Tie';
          } else if (computerMove === 'Paper') {
            result = 'You Lose.';
          } else if (computerMove === 'Scissors') {
            result = 'You Win.';
          }

        } else if (move === 'Paper') {

          if (computerMove === 'Rock') {
            result = 'You Win.';
          } else if (computerMove === 'Paper') {
            result = 'Tie';
          } else if (computerMove === 'Scissors') {
            result = 'You Lose.';
          }

        } else if (move === 'Scissors') {

          if (computerMove === 'Rock') {
            result = 'You Lose.';
          } else if (computerMove === 'Paper') {
            result = 'You Win.';
          } else if (computerMove === 'Scissors') {
            result = 'Tie';
          }

        }

        alert(`You picked ${move}. Computer picked ${computerMove}. ${result}`);
      }
    </script>
  </body>
</html>
